<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><meta charset="utf-8">
<title>El Rosal en Cifras</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Portal de información estadística de la Alcaldía Municipal de El Rosal (Cundinamarca) – Plan Estadístico Municipal 2026-2027">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: menú lateral retráctil (rail de iconos al recogerlo) + barra superior + contenido; inicio con titular editorial y tarjetas que giran; tableros con paleta orgánica. Rejilla 4/8 px. */
:root{
  --bg:#FFFFFF; --s:#FFFFFF; --sunk:#F6F8F3; --hover:#F1F5EC; --line:#E4E9DF; --line2:#D6DDCF;
  --ink:#1C2118; --mu:#525D4B; --fa:#8A9482;
  --g900:#1E3A12; --g800:#27501A; --g700:#2F6320; --g600:#3D7A26; --g500:#5A9E2F; --g300:#A3D06A; --g100:#EAF4DE; --g50:#F5FAEF;
  --btn:#2F6320; --btn-fg:#FFFFFF; --accent:#3D7A26; --sun:#F2B705; --sun-ink:#1C2118;
  --c1:#4E7D2F; --c2:#C0643A; --c3:#D4A23C; --c4:#4F8A83; --c5:#8C5A6B; --c6:#5B7FA6; --c7:#8A9A3B; --c8:#B98A5E; --track:#ECE6DA; --grid:#EEF1EA;
  --ok:#2F6320; --ok-bg:#EAF4DE; --warn:#8A5D00; --warn-bg:#FBF1D6; --bad:#A63E24; --bad-bg:#F8E5DE; --info:#2C6661; --info-bg:#E3F0EE;
  --back:#2F6320; --back-fg:#FFFFFF; --back-mu:#E2EFD3; --back-btn:#A3D06A; --back-btn-fg:#1E3A12;
  --shadow:0 1px 2px rgba(30,58,18,.05); --shadow-lg:0 1px 2px rgba(30,58,18,.04),0 18px 40px -24px rgba(30,58,18,.25);
  --f:"Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; --f-serif:"Instrument Serif",Georgia,serif; --f-mono:"Geist Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.16,1,.3,1); --t:200ms; --side:256px; color-scheme:light;
}

:root.dark{
  --bg:#10150E; --s:#161C13; --sunk:#1A2117; --hover:#20281C; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#ECF1E6; --mu:#B5C0AC; --fa:#86917E;
  --g100:#24331C; --g50:#1A2316; --btn:#A3D06A; --btn-fg:#14260B; --accent:#A3D06A; --sun-ink:#1C2118;
  --c1:#82B85D; --c2:#E28C64; --c3:#E8C064; --c4:#76B5AD; --c5:#BC8899; --c6:#89A9CE; --c7:#B6C468; --c8:#D5AD84; --track:#2A3125; --grid:#20271C;
  --ok:#A3D06A; --ok-bg:#24331C; --warn:#E8C064; --warn-bg:#352B12; --bad:#EE9A80; --bad-bg:#3A1F18; --info:#86C9C1; --info-bg:#173230;
  --back:#24401A; --back-fg:#F2F7EC; --back-mu:#CFE0BE; --back-btn:#A3D06A; --back-btn-fg:#14260B;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 1px 2px rgba(0,0,0,.3),0 18px 40px -20px rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.025em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-size:12px}
td.mono{white-space:nowrap}
.num,td.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
em.serif,.serif{font-family:var(--f-serif);font-style:italic;font-weight:400;letter-spacing:-.01em;color:var(--accent)}

/* Estructura */
.shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;transition:grid-template-columns 260ms var(--ease)}
.shell.mini{--side:76px}
.side{position:sticky;top:0;height:100vh;background:var(--s);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px;padding:20px 14px calc(16px + env(safe-area-inset-bottom,0px)) max(14px,env(safe-area-inset-left,0px));z-index:30;overflow:visible}
.brand{display:flex;align-items:center;gap:12px;padding:0 4px;min-height:40px;text-decoration:none;color:inherit}
.logo{width:40px;height:40px;flex:none;border-radius:11px;background:var(--g700);display:grid;place-items:center}
.brand .bt{min-width:0;overflow:hidden;white-space:nowrap}
.brand b{display:block;font-size:15px;font-weight:700;letter-spacing:-.01em}
.brand small{font-size:12px;color:var(--mu)}
.tog{position:absolute;right:-13px;top:28px;width:26px;height:26px;border-radius:50%;background:var(--s);border:1px solid var(--line2);display:grid;place-items:center;color:var(--mu);cursor:pointer;box-shadow:var(--shadow);transition:transform var(--t) var(--ease),color var(--t) var(--ease)}
.tog:hover{color:var(--ink);transform:scale(1.08)}
.tog svg{transition:transform 260ms var(--ease)}
.shell:not(.mini) .tog svg{transform:rotate(180deg)}
.grp{display:flex;flex-direction:column;gap:2px}
.grp h6{margin:0;font-size:11px;font-weight:600;color:var(--fa);padding:0 10px 8px;letter-spacing:.08em;white-space:nowrap;overflow:hidden}
.it{position:relative;display:flex;align-items:center;gap:12px;height:40px;padding:0 10px;border-radius:10px;color:var(--mu);font-weight:500;font-size:14px;text-decoration:none;white-space:nowrap;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.it svg{flex:none}
.it:hover{background:var(--hover);color:var(--ink)}
.it:active{transform:scale(.98)}
.it[aria-current="page"]{background:var(--g100);color:var(--ink);font-weight:600}
.it[aria-current="page"] svg{color:var(--accent)}
.it .lbl{overflow:hidden;text-overflow:ellipsis}
.it .n{margin-left:auto;font-size:12px;color:var(--fa);font-variant-numeric:tabular-nums}
.it .bd{margin-left:auto;background:var(--sun);color:var(--sun-ink);font-size:11px;font-weight:700;border-radius:99px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center}
.vbox{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--g50)}
.vbox small{font-size:11px;font-weight:600;color:var(--mu);letter-spacing:.06em;white-space:nowrap}
.vseg{display:flex;padding:3px;border-radius:9px;background:var(--s);border:1px solid var(--line2)}
.vseg button{flex:1;height:30px;border:0;border-radius:7px;background:transparent;font-size:12px;font-weight:600;color:var(--mu);cursor:pointer;transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.vseg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.vmini{display:none;margin-top:auto;width:44px;height:44px;border-radius:11px;border:1px solid var(--line2);background:var(--g50);color:var(--accent);place-items:center;cursor:pointer}
.status{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);padding:0 6px;white-space:nowrap;overflow:hidden}
.status i{width:7px;height:7px;flex:none;border-radius:50%;background:var(--fa)}
.status.vivo i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.status.estatico i{background:var(--sun)}
/* Rail recogido */
.shell.mini .side{padding-left:16px;padding-right:16px;align-items:center}
.shell.mini .brand .bt,.shell.mini .grp h6,.shell.mini .it .lbl,.shell.mini .it .n,.shell.mini .vbox,.shell.mini .status span{display:none}
.shell.mini .grp{align-items:center}
.shell.mini .grp+.grp{border-top:1px solid var(--line);padding-top:12px}
.shell.mini .it{width:44px;height:44px;padding:0;justify-content:center}
.shell.mini .it .bd{position:absolute;top:6px;right:6px;min-width:8px;width:8px;height:8px;padding:0;font-size:0;box-shadow:0 0 0 2px var(--s)}
.shell.mini .vmini{display:grid}
.shell.mini .status{justify-content:center;padding:0}

.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:64px;display:flex;align-items:center;gap:16px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));background:color-mix(in srgb,var(--s) 86%,transparent);backdrop-filter:saturate(1.3) blur(12px);-webkit-backdrop-filter:saturate(1.3) blur(12px);border-bottom:1px solid var(--line)}
.themeb{width:38px;height:38px;flex:none;border-radius:10px;border:1px solid var(--line2);background:var(--s);color:var(--mu);display:grid;place-items:center;cursor:pointer;transition:color var(--t) var(--ease),transform var(--t) var(--ease)}
.themeb:hover{color:var(--ink);transform:scale(1.04)}.themeb:active{transform:scale(.96)}
.burger{display:none;width:40px;height:40px;border-radius:10px;border:1px solid var(--line2);background:var(--s);place-items:center;cursor:pointer}
.crumb{font-size:13px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.crumb b{color:var(--ink);font-weight:600}
.k{margin-left:auto;display:flex;align-items:center;gap:8px;width:min(320px,40vw);height:38px;border:1px solid var(--line2);border-radius:10px;padding:0 12px;background:var(--s);transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.k:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--g100)}
.k svg{flex:none;color:var(--fa)}
.k input{border:0;outline:0;background:transparent;min-width:0;flex:1;font-size:13px}
.k kbd{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line2);border-radius:5px;padding:1px 6px;color:var(--mu)}
.me{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mu);white-space:nowrap}
.me img{width:34px;height:34px;border-radius:50%;box-shadow:0 0 0 1px var(--line2)}
.content{padding:32px max(24px,env(safe-area-inset-right,0px)) 64px max(24px,env(safe-area-inset-left,0px));max-width:1320px;width:100%}
section.view{display:flex;flex-direction:column;gap:24px;animation:rise 260ms var(--ease) both}
@keyframes rise{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head h2{font-size:36px;font-weight:800;letter-spacing:-.04em;margin-top:6px}
.head p{margin:8px 0 0;color:var(--mu);max-width:68ch;font-size:15px}
footer{margin-top:auto;border-top:1px solid var(--line);padding:20px max(24px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px 24px;font-size:12px;color:var(--mu)}

/* Inicio */
.hero{position:relative;overflow:hidden;margin:-32px -24px 0;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--g50),var(--bg) 88%)}
.hero svg.topo{position:absolute;right:-180px;top:-40px;width:880px;height:560px;pointer-events:none}
.hero .in{position:relative;padding:72px 48px 64px;max-width:820px}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.hero-fade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--bg) 0%,color-mix(in srgb,var(--bg) 84%,transparent) 36%,color-mix(in srgb,var(--bg) 25%,transparent) 58%,transparent 78%),linear-gradient(180deg,color-mix(in srgb,var(--g50) 55%,transparent),transparent 40%)}
.hero .in{z-index:2}
@media (max-width:760px){.hero-fade{background:linear-gradient(180deg,color-mix(in srgb,var(--bg) 30%,transparent) 0%,color-mix(in srgb,var(--bg) 88%,transparent) 42%,var(--bg) 100%)}}

.tag{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 14px 0 6px;border-radius:99px;background:var(--s);border:1px solid var(--line2);font-size:13px;font-weight:500;color:var(--mu)}
.tag i{font-style:normal;background:var(--btn);color:var(--btn-fg);border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700}
.hero h1{font-size:clamp(36px,5.2vw,64px);line-height:1.02;letter-spacing:-.045em;font-weight:800;margin-top:24px}
.hero h1 em{font-family:var(--f-serif);font-weight:400;font-style:italic;letter-spacing:-.015em;color:var(--accent)}
.lead{font-size:18px;color:var(--mu);margin:20px 0 0;max-width:560px;line-height:1.55}
.sb{margin-top:32px;display:flex;align-items:center;gap:12px;max-width:620px;height:60px;background:var(--s);border:1px solid var(--line2);border-radius:16px;padding:0 8px 0 18px;box-shadow:var(--shadow-lg);transition:border-color var(--t) var(--ease)}
.sb:focus-within{border-color:var(--accent)}
.sb svg{flex:none;color:var(--fa)}
.sb input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;font-size:13px;color:var(--mu);align-items:center}
.chips button{border:1px solid var(--line2);background:var(--s);border-radius:99px;padding:6px 12px;color:var(--ink);font-weight:500;font-size:13px;cursor:pointer;transition:border-color var(--t) var(--ease),transform var(--t) var(--ease)}
.chips button:hover{border-color:var(--accent)}
.chips button:active{transform:scale(.97)}
.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.sh h2{font-size:28px;font-weight:800;letter-spacing:-.03em}
.sh p{color:var(--mu);margin:6px 0 0;font-size:15px}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.fc{perspective:1400px;height:330px;cursor:pointer;border:0;padding:0;background:none;text-align:center;color:inherit;border-radius:18px}
.fc .inr{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 700ms var(--ease)}
@media (hover:hover){.fc:hover .inr{transform:rotateY(180deg)}}
.fc:focus-visible .inr,.fc.on .inr{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px}
.front{background:var(--s);border:1px solid var(--line);box-shadow:var(--shadow-lg);gap:18px}
.front svg{width:180px;height:160px;max-width:100%}
.front b{font-size:20px;font-weight:700;letter-spacing:-.02em}
.front small{font-size:13px;color:var(--mu);margin-top:-12px;font-variant-numeric:tabular-nums}
.back{transform:rotateY(180deg);background:var(--back);color:var(--back-fg);gap:16px;padding:32px;background-image:radial-gradient(120% 80% at 100% 0%,rgba(163,208,106,.32),transparent 60%)}
.back .num{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--g300)}
.back b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.back p{margin:0;font-size:15px;line-height:1.6;color:var(--back-mu);max-width:300px}
.back .ex{height:42px;padding:0 18px;border-radius:10px;background:var(--back-btn);color:var(--back-btn-fg);font-weight:700;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);border-radius:20px;overflow:hidden;background:var(--s)}
.st{padding:24px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:6px;min-width:0}
.st:first-child{border-left:0}
.st b{font-size:42px;font-weight:800;letter-spacing:-.05em;font-variant-numeric:tabular-nums;line-height:1;color:var(--accent)}
.st b span{font-size:20px;color:var(--fa)}
.st span{font-size:14px;color:var(--mu)}
.st small{font-size:12px;color:var(--fa);margin-top:6px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:16px;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;counter-increment:s;color:var(--mu)}
.steps li b{color:var(--ink);font-weight:600}
.steps li::before{content:counter(s);width:28px;height:28px;border-radius:99px;background:var(--g100);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.feed li:first-child{border-top:0}
.feed time{color:var(--fa);font-size:12px;flex:none;width:76px;font-family:var(--f-mono)}

/* Paneles, filtros y tablas */
.panel{background:var(--s);border:1px solid var(--line);border-radius:16px;padding:22px 24px;display:flex;flex-direction:column;gap:18px;min-width:0;box-shadow:var(--shadow);position:relative}
.panel h3{font-size:16px;font-weight:700;letter-spacing:-.02em}
.panel .s{font-size:12px;color:var(--mu);margin-top:3px}
.pt{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input,.filters select{height:38px;padding:0 12px;border:1px solid var(--line2);border-radius:10px;background:var(--s);max-width:100%;transition:border-color var(--t) var(--ease),box-shadow var(--t) var(--ease)}
.filters input:focus,.filters select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--g100)}
.filters input[type=search]{flex:1 1 240px;min-width:0}
.seg{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line2);border-radius:10px;background:var(--g50)}
.seg button{border:0;background:transparent;height:30px;padding:0 12px;border-radius:7px;cursor:pointer;font-size:13px;font-weight:600;color:var(--mu);transition:background var(--t) var(--ease),color var(--t) var(--ease)}
.seg button[aria-pressed="true"]{background:var(--s);color:var(--ink);box-shadow:var(--shadow),0 0 0 1px var(--line)}
.count{font-size:12px;color:var(--mu);margin-left:auto;font-variant-numeric:tabular-nums}
.tablewrap{overflow-x:auto;background:var(--s);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-weight:600;font-size:12px;color:var(--mu);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr{transition:background var(--t) var(--ease)}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
td .sub{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--mu)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.info{background:var(--info-bg);color:var(--info)}
.ods{display:inline-grid;place-items:center;min-width:24px;height:20px;padding:0 4px;border-radius:5px;color:#fff;font-weight:700;font-size:11px}
.prog{display:flex;align-items:center;gap:8px;min-width:120px}
.prog .track{flex:1;height:6px;border-radius:99px;background:var(--track);overflow:hidden}
.prog .track i{display:block;height:100%;border-radius:99px}
.prog small{font-variant-numeric:tabular-nums;color:var(--mu);width:40px;text-align:right;font-size:12px}
.pend{color:var(--warn);font-weight:600}

<script>
"use strict";
/* ---------- Estado ---------- */
const S={directorio:[],hallazgos:[],instancias:[],documentos:[],fuentes:[],acciones:[],pol17:[],indicadores:[],mediciones:[],actas:[],aportes:[],config:{},catFuente:""};
const C={db:null,user:null,dl:null,assets:null,uid:null,canEdit:false,mode:"cargando",profiles:{}};
const UI={dirQ:"",dirT:"todos",citizen:false,view:"inicio",docScope:"pem",docQ:"",docSerie:"",docEstado:"",indQ:"",indEje:"",indDep:"",indOds:"",fuQ:"",aporteTipo:"medicion"};
const VIEWS_ALL=[["inicio","Inicio"],["documentos","Documentos"],["estadisticas","Indicadores"],["tableros","Tableros"],["fuentes","Fuentes de datos"],["mesa","Coordinación"],["mejora","Plan de mejora"],["participa","Encuestas"],["directorio","Directorio"],["datos","Datos abiertos"],["aportar","Reportar información"],["revision","Revisión"]];
const VIEWS=VIEWS_ALL;
const ODS_C={1:"#E5243B",2:"#DDA63A",3:"#4C9F38",4:"#C5192D",5:"#FF3A21",6:"#26BDE2",7:"#FCC30B",8:"#A21942",9:"#FD6925",10:"#DD1367",11:"#FD9D24",12:"#BF8B2E",13:"#3F7E44",14:"#0A97D9",15:"#56C02B",16:"#00689D",17:"#19486A"};
const ODS_N={1:"Fin de la pobreza",2:"Hambre cero",3:"Salud y bienestar",4:"Educación de calidad",5:"Igualdad de género",6:"Agua limpia y saneamiento",7:"Energía asequible",8:"Trabajo decente y crecimiento",9:"Industria, innovación e infraestructura",10:"Reducción de desigualdades",11:"Ciudades y comunidades sostenibles",12:"Producción y consumo responsables",13:"Acción por el clima",14:"Vida submarina",15:"Vida de ecosistemas terrestres",16:"Paz, justicia e instituciones sólidas",17:"Alianzas para lograr los objetivos"};
const SERIES={PL:"Plan",PO:"Política / lineamiento",MA:"Manual",PR:"Procedimiento / protocolo",MT:"Matriz",IN:"Inventario / índice",DI:"Diccionario",FT:"Ficha técnica",DG:"Diagnóstico",IF:"Informe",AC:"Acto / acta",PP:"Presentación",EV:"Evidencia",TB:"Tablero",CD:"Conjunto de datos",NR:"Norma",SW:"Software",IM:"Imagen / infografía"};
const DEPS={DES:"Despacho",SGG:"Secretaría General y de Gobierno",SPL:"Secretaría de Planeación",SHA:"Secretaría de Hacienda",SOP:"Secretaría de Obras Públicas",SDS:"Secretaría de Desarrollo Social, Salud y Educación",SDE:"Secretaría de Desarrollo Económico y Medio Ambiente",PTIC:"Jefatura de Prensa y TIC",OCI:"Oficina de Control Interno",ESP:"Empresa de Servicios Públicos",IND:"Imdercultur",EXT:"Fuente externa"};

/* ---------- Utilidades ---------- */
const ED=()=>C.canEdit&&!UI.citizen;
const LIVE=()=>C.mode==="vivo"&&!UI.citizen;
const $=s=>document.querySelector(s);
const h=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(n==null||n==="")?"—":Number(n).toLocaleString("es-CO",{maximumFractionDigits:2});
const pend=v=>{const s=String(v??"");if(!s||s==="—")return '<span class="pend">[PENDIENTE]</span>';return h(s).replace(/\[PENDIENTE[^\]]*\]/g,m=>'<span class="pend">'+m+'</span>')};
const today=()=>new Date().toISOString().slice(0,10);
const mill=v=>(v==null||v==="")?"—":"$ "+(Number(v)/1e6).toLocaleString("es-CO",{maximumFractionDigits:1})+" M";
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,3200)}
function estadoPill(e){
  const s=String(e||"Sin estado"),l=s.toLowerCase();
  let k="";
  if(/aprob|publicad|producto elaborado|cumpl|validad|vigente|activo/.test(l))k="ok";
  else if(/curso|revisi|borrador|parcial|pendiente de revisi/.test(l))k="info";
  else if(/sin iniciar|por validar|pendiente|programad/.test(l))k="warn";
  else if(/rechaz|vencid|obsolet|no aplica/.test(l))k="bad";
  return '<span class="pill '+k+'">'+h(s)+'</span>';
}
function ods(n){n=Number(n);return n?'<span class="ods" style="background:'+ODS_C[n]+'" data-tip="ODS '+n+' · '+h(ODS_N[n])+'">'+n+'</span>':'<span class="pend">—</span>'}

function lastMed(n){const m=S.mediciones.filter(x=>x.n==n&&x.estado==="Publicado").sort((a,b)=>String(b.periodo).localeCompare(String(a.periodo)));return m[0]||null}
function avance(ind){const m=lastMed(ind.n);if(!m||!Number(ind.meta))return null;return Math.max(0,Number(m.valor)/Number(ind.meta))}

function uniq(a){return [...new Set(a.filter(Boolean))].sort((x,y)=>String(x).localeCompare(String(y),"es"))}

async function resolveNames(){if(!C.user)return;const ids=uniq([...S.mediciones,...S.aportes,...S.actas].map(x=>x.autor));if(!ids.length)return;try{C.profiles=await C.user.profiles(ids)}catch(e){}}

/* ---------- Datos: base compartida (claude.ai) o archivo estático (subdominio) ---------- */
const COLS=["documentos","fuentes","acciones","pol17","mediciones","actas","aportes","directorio","hallazgos","instancias"];
const SORT={documentos:"codigo",fuentes:"id",acciones:"id",pol17:"id",mediciones:"ts",actas:"fecha",aportes:"ts",directorio:"entidad",hallazgos:"id",instancias:"orden"};
function applyDocs(col,arr){S[col]=arr.slice().sort((a,b)=>String(a[SORT[col]]||"").localeCompare(String(b[SORT[col]]||""),"es",{numeric:true}));}
let rTimer=null;function scheduleRender(){clearTimeout(rTimer);rTimer=setTimeout(async()=>{await resolveNames();render()},60)}
async function boot(){
  render();
  const cl=window.claude;
  let db=null;
  if(cl&&typeof cl.use==="function"){try{db=await cl.use("db")}catch(e){db=null}}
  if(db){
    C.db=db;C.mode="vivo";
    try{C.user=await cl.use("user")}catch(e){}
    if(C.user){try{const me=await C.user.me();C.uid=me.id;C.canEdit=me.canEdit;C.me=me}catch(e){}}
    cl.use("downloads").then(x=>{C.dl=x;if(UI.view==="revision")render()}).catch(()=>{});
    if(C.canEdit)cl.use("assets").then(x=>{C.assets=x}).catch(()=>{});
    COLS.forEach(col=>{
      db.collection(col).onSnapshot(snap=>{applyDocs(col,snap.docs.map(d=>Object.assign({_id:d.id},d.data())));scheduleRender()},err=>{console.warn(col,err);if(err&&err.code==="revoked"){C.mode="estatico";render()}});
    });
    db.doc("catalogo/indicadores").onSnapshot(s=>{const d=s.exists?s.data():null;S.indicadores=d?d.items||[]:[];S.catFuente=d?d.fuente||"":"";scheduleRender()});
    db.doc("config/portal").onSnapshot(s=>{S.config=s.exists?s.data():{};scheduleRender()});
  }else{
    await loadStatic();
  }
  render();
}
async function loadStatic(){
  C.mode="estatico";
  try{
    const r=await fetch("datos.json",{cache:"no-store"});const j=await r.json();
    COLS.forEach(c=>applyDocs(c,(j[c]||[]).map(x=>Object.assign({_id:x.codigo||x.id||x._id},x))));
    S.indicadores=(j.catalogo&&j.catalogo.indicadores&&j.catalogo.indicadores.items)||[];
    S.config=j.config||{};
  }catch(e){C.mode="sin-datos"}
}
async function write(col,id,data,merge){
  if(!C.db){toast("Esta copia es de solo lectura. Registre el aporte en el portal de trabajo.");return false}
  try{const ref=id?C.db.collection(col).doc(id):C.db.collection(col).doc();if(merge)await ref.update(data);else await ref.set(data);return ref.id}
  catch(e){toast(e&&e.code==="invalid_argument"?"No tiene permiso para guardar en esta sección.":e&&e.code==="quota_exceeded"?"La base llegó a su límite de registros. Avise a Prensa y TIC.":"No se pudo guardar. Intente de nuevo.");console.warn(e);return false}
}

const ISO=(()=>{const T='#A3D06A',L='#5A9E2F',R='#3D7A26',W='#FFFFFF',WL='#E4EADC',WR='#CBD5BF';
  const P=(X,Y,Z)=>{const s=9;return [90+(X-Y)*0.866*s,92+(X+Y)*0.5*s-Z*s]};
  const poly=(pts,f)=>`<polygon points="${pts.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="${f}" stroke="${f}" stroke-width=".6" stroke-linejoin="round"/>`;
  const box=(x,y,z,w,d,hh,c=[T,L,R])=>poly([P(x,y+d,z),P(x+w,y+d,z),P(x+w,y+d,z+hh),P(x,y+d,z+hh)],c[1])+poly([P(x+w,y,z),P(x+w,y+d,z),P(x+w,y+d,z+hh),P(x+w,y,z+hh)],c[2])+poly([P(x,y,z+hh),P(x+w,y,z+hh),P(x+w,y+d,z+hh),P(x,y+d,z+hh)],c[0]);
  const base=()=>box(-5.3,-5.3,-1.9,10.6,10.6,.7,[L,L,R])+box(-5,-5,-1.2,10,10,1.2,['#EEF5E4','#DCE6D0','#C6D3B8']);
  const cyl=(cx,cy,z,r,hh,c=[T,L])=>{const [x,y]=P(cx,cy,z),[x2,y2]=P(cx,cy,z+hh),rx=r*9*1.1,ry=r*9*.6;return `<path d="M${x-rx},${y2} L${x-rx},${y} A${rx},${ry} 0 0 0 ${x+rx},${y} L${x+rx},${y2} Z" fill="${c[1]}"/><ellipse cx="${x2}" cy="${y2}" rx="${rx}" ry="${ry}" fill="${c[0]}"/>`};
  return {
    estadisticas:()=>base()+box(-3.5,-1,0,1.6,1.6,3)+box(-1.2,-1,0,1.6,1.6,5)+box(1.1,-1,0,1.6,1.6,7.5)+box(3.4,-1,0,1.6,1.6,4.2),
    tableros:()=>base()+box(-3.5,1.5,0,7,.6,6.5,[T,'#E9F3DD',R])+`<polyline points="${[[-3,2],[-1.5,3.4],[0,2.8],[1.5,4.6],[3,5.4]].map(a=>P(a[0],2.1,a[1]).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="${R}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>`+box(-3.5,-3.5,0,2.4,2.4,1.2)+box(-.5,-3.5,0,2.4,2.4,2)+box(2.5,-3.5,0,1.2,2.4,.8),
    documentos:()=>base()+box(-3,-3,0,5,6.5,.5,[W,WL,WR])+box(-2.6,-2.6,.5,5,6.5,.5,[W,WL,WR])+box(-2.2,-2.2,1,5,6.5,.5,[T,L,R])+box(2.2,-3.5,0,.7,5,6)+box(3.1,-3.5,0,.7,5,4.6,[W,WL,WR]),
    fuentes:()=>base()+cyl(0,0,0,3.2,2.2)+cyl(0,0,2.6,3.2,2.2)+cyl(0,0,5.2,3.2,2.2,[W,L]),
    mesa:()=>base()+box(-2.5,-2.5,0,5,5,1.6,[W,WL,WR])+[[-3.8,-.5],[3.2,-.5],[-.4,-3.8],[-.4,3.2]].map(([a,b])=>box(a,b,0,1,1,1.3)+cyl(a+.5,b+.5,1.8,.55,1.4,[T,R])).join('')+box(-1,-1,1.6,2,2,.3),
    datos:()=>base()+box(-3,-3,0,6,6,2.2)+box(-.7,-.7,2.2,1.4,1.4,3,[W,WL,WR])+poly([P(-1.8,-1.8,5.2),P(1.8,-1.8,5.2),P(1.8,1.8,5.2),P(-1.8,1.8,5.2)],WL)+poly([P(1.8,-1.8,5.2),P(1.8,1.8,5.2),P(0,0,8)],WR)+poly([P(-1.8,1.8,5.2),P(1.8,1.8,5.2),P(0,0,8)],W)
  }})();
function topo(){let p='';const n=(a,k)=>Math.sin(a*3+k*.7)*.06+Math.sin(a*5-k*.4)*.035+Math.cos(a*2+k*.3)*.05;
  for(let k=0;k<16;k++){const rx=60+k*30,ry=40+k*22;let d='';for(let i=0;i<=96;i++){const a=i/96*Math.PI*2,f=1+n(a,k);d+=(i?'L':'M')+(500+Math.cos(a)*rx*f).toFixed(1)+' '+(280+Math.sin(a)*ry*f).toFixed(1)}
    p+=`<path d="${d}Z" fill="none" stroke="var(${k%4===0?'--g500':'--g300'})" stroke-opacity="${k%4===0?.5:.45}" stroke-width="${k%4===0?1.3:.8}"/>`}
  return `<svg class="topo" viewBox="0 0 880 560" aria-hidden="true">${p}<circle cx="500" cy="280" r="5" fill="var(--g600)"/><circle cx="500" cy="280" r="15" fill="var(--g500)" opacity=".15"/></svg>`}

/* ---------- Fondo animado del inicio: gráficas integradas (canvas, sin dependencias) ---------- */
window.HeroBG=(()=>{
  let stopPrev=null;
  function start(canvas){
    if(stopPrev)stopPrev();
    const ctx=canvas.getContext("2d");
    const reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const SPEED=1;
    let W=0,H=0,C={},parts=[],t=0,last=0,raf=0,running=true;
    const COS=Math.cos(Math.PI/6),SIN=Math.sin(Math.PI/6);
    const narrow=()=>W<760;
    const ease=x=>1-Math.pow(1-Math.min(1,Math.max(0,x)),3);
    function colors(){const cs=getComputedStyle(document.documentElement);["g900","g800","g700","g600","g500","g300","g100","g50","c1","c2","c3","c4","c6","grid","line2","bg"].forEach(k=>C[k]=cs.getPropertyValue("--"+k).trim());C.dark=document.documentElement.classList.contains("dark")}
    function resize(){const d=Math.min(window.devicePixelRatio||1,2),r=canvas.getBoundingClientRect();W=r.width;H=r.height;canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0);
      const n=Math.round(Math.min(22,Math.max(8,W*H/46000)));parts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*10,vy:(Math.random()-.5)*10}))}
    const A=a=>{ctx.globalAlpha=a};
    // Entrada escalonada de cada gráfica (0–1)
    const intro=(delay,dur=1.4)=>reduce?1:ease((t-delay)/dur);

    /* 1. Curvas de nivel (identidad del portal) */
    function contours(){const cx=W*(narrow()?.72:.7)+Math.sin(t*.07)*10,cy=H*(narrow()?.22:.42)+Math.cos(t*.05)*8,m=Math.min(W,H),gap=m*.06;
      ctx.lineWidth=1;ctx.strokeStyle=C.g500;
      for(let k=1;k<=12;k++){const base=gap*(k+.4);A(Math.max(.05,.36-k*.026)*intro(0,2));ctx.beginPath();
        for(let i=0;i<=140;i++){const a=i/140*Math.PI*2,r=base*(1+.13*Math.sin(3*a+t*.18+k*.35)+.07*Math.sin(5*a-t*.13+k*.6)+.04*Math.sin(2*a+t*.09));const x=cx+Math.cos(a)*r*1.25,y=cy+Math.sin(a)*r*.9;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}
      const p=(t%2.6)/2.6;ctx.fillStyle=C.g700;A((1-p)*.35);ctx.beginPath();ctx.arc(cx,cy,6+p*24,0,7);ctx.fill();A(.85);ctx.beginPath();ctx.arc(cx,cy,5,0,7);ctx.fill();A(1)}

    /* 2. Red de puntos */
    function network(dt){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20});
      ctx.strokeStyle=C.g500;ctx.lineWidth=.8;for(let i=0;i<parts.length;i++)for(let j=i+1;j<parts.length;j++){const a=parts[i],b=parts[j],d=Math.hypot(a.x-b.x,a.y-b.y);if(d<120){A((1-d/120)*.16);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
      ctx.fillStyle=C.g500;A(.35);parts.forEach(p=>{ctx.beginPath();ctx.arc(p.x,p.y,1.6,0,7);ctx.fill()});A(1)}

    /* 3. Columnas 2D con eje y cuadrícula (abajo a la derecha) */
    function columns(){if(narrow())return;const x0=W*.58,x1=W*.97,base=H*.95,hMax=H*.2,n=12,gw=(x1-x0)/n,bw=gw*.36,k=intro(.4,1.6);
      ctx.strokeStyle=C.g300;ctx.lineWidth=1;for(let g=1;g<=3;g++){A(.22);ctx.setLineDash([2,5]);ctx.beginPath();ctx.moveTo(x0,base-hMax*g/3);ctx.lineTo(x1,base-hMax*g/3);ctx.stroke()}ctx.setLineDash([]);
      for(let i=0;i<n;i++){const trend=.35+i*.045,v1=Math.min(1,trend+.18*Math.sin(t*.6+i*.8)),v2=Math.min(1,trend*.72+.14*Math.sin(t*.5+i*1.3+1));
        const x=x0+i*gw+gw*.12,stg=ease((k*n-i*.6)/2.2);
        A(.36);ctx.fillStyle=C.g600;rr(x,base-v1*hMax*stg,bw,v1*hMax*stg,3);
        A(.3);ctx.fillStyle=C.g300;rr(x+bw+2,base-v2*hMax*stg,bw,v2*hMax*stg,3)}
      A(.5);ctx.strokeStyle=C.g700;ctx.beginPath();ctx.moveTo(x0,base+.5);ctx.lineTo(x1,base+.5);ctx.stroke();A(1)}

}

function spark(meds,meta){
  if(!meds.length)return "";
  const W=520,H=150,P=34,max=Math.max(Number(meta)||0,...meds.map(m=>Number(m.valor)||0))*1.1||1;
  const x=i=>P+(meds.length===1?(W-2*P)/2:i*(W-2*P)/(meds.length-1)),y=v=>H-24-(v/max)*(H-44);
  const pts=meds.map((m,i)=>x(i)+","+y(Number(m.valor)||0)).join(" ");
  const last=meds[meds.length-1];
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Serie de mediciones">
  ${meta?`<line x1="${P}" x2="${W-P}" y1="${y(meta)}" y2="${y(meta)}" stroke="var(--warn)" stroke-dasharray="4 4"/><text x="${W-P}" y="${y(meta)-5}" text-anchor="end">Meta 2028: ${fmt(meta)}</text>`:""}
  <line x1="${P}" x2="${W-P}" y1="${H-24}" y2="${H-24}" stroke="var(--line)"/>
  <polygon points="${x(0)},${H-24} ${pts} ${x(meds.length-1)},${H-24}" fill="var(--accent)" fill-opacity=".08"/>
  <defs><linearGradient id="sg" x1="0" x2="1"><stop offset="0" stop-color="var(--accent)" stop-opacity=".35"/><stop offset="1" stop-color="var(--accent)"/></linearGradient></defs><polyline points="${pts}" fill="none" stroke="url(#sg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  ${meds.map((m,i)=>`<circle cx="${x(i)}" cy="${y(Number(m.valor)||0)}" r="${i===meds.length-1?4:2.5}" fill="${i===meds.length-1?"var(--accent)":"var(--surface)"}" stroke="var(--accent)" stroke-width="1.5" data-tip="${h(m.periodo)}: ${fmt(m.valor)}"/><text x="${x(i)}" y="${H-8}" text-anchor="middle">${h(m.periodo)}</text>`).join("")}
  <text class="lbl" x="${x(meds.length-1)}" y="${y(Number(last.valor)||0)-9}" text-anchor="middle">${fmt(last.valor)}</text>
  </svg></div>`;
}
function openInd(n){

  ${meds.length?`<div class="tablewrap"><table><thead><tr><th>Corte</th><th>Valor</th><th>Fuente</th><th>Estado</th></tr></thead><tbody>${meds.slice().reverse().map(m=>`<tr><td class="num">${h(m.periodo)}</td><td class="num">${fmt(m.valor)}</td><td>${h(m.fuente)}<span class="sub">${h(nameOf(m.autor))}</span></td><td>${estadoPill(m.estado)}</td></tr>`).join("")}</tbody></table></div>`:""}

function vParticipa(){

vParticipa.after=()=>{
  document.querySelectorAll("[data-en]").forEach(b=>b.onclick=()=>{UI.enc=b.dataset.en;render()});
  const f=$("#fEnc");if(!f)return;
  f.addEventListener("submit",async ev=>{ev.preventDefault();const k=UI.enc||"demanda",E=ENC[k],r={};
    E.q.forEach(([id,l,ty])=>{if(ty==="esc"){const s=f.querySelector(`input[name="e_${id}"]:checked`);r[id]=s?Number(s.value):null}else r[id]=$("#e_"+id).value.trim()});

};
function encResumen(){
  const D=S.aportes.filter(a=>a.tipo==="encuesta-demanda"),Sa=S.aportes.filter(a=>a.tipo==="encuesta-satisfaccion");
  const avg=k=>{const v=Sa.map(a=>a.respuestas&&a.respuestas[k]).filter(x=>typeof x==="number");return v.length?(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):"—"};
  const top={};D.forEach(a=>{const t=a.respuestas&&a.respuestas.tema;if(t)top[t]=(top[t]||0)+1});
  const T=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
  return `<div class="cols"><div class="panel"><h3>Demanda de información (${D.length})</h3>${T.length?`<ul class="feed">${T.map(([t,n])=>`<li><time>${n}</time><span>${h(t)}</span></li>`).join("")}</ul>`:'<p class="s">Sin respuestas todavía.</p>'}
  ${D.length?`<details><summary class="s">Ver solicitudes</summary><ul class="feed">${D.slice().sort((a,b)=>String(b.ts).localeCompare(String(a.ts))).slice(0,30).map(a=>`<li><time>${h(String(a.ts).slice(0,10))}</time><span>${h(a.respuestas.tema||"")}: ${h(a.respuestas.detalle||"")} <span class="sub">${h(a.respuestas.uso||"")} · ${h(a.respuestas.formato||"")} · encontró: ${h(a.respuestas.encontro||"")}</span></span></li>`).join("")}</ul></details>`:""}</div>
  <div class="panel"><h3>Satisfacción (${Sa.length} respuestas)</h3><dl class="ficha">${[["Facilidad","facilidad"],["Utilidad","utilidad"],["Actualidad","actualidad"],["Claridad","claridad"],["General","general"]].map(([l,k])=>`<dt>${l}</dt><dd>${avg(k)} / 5</dd>`).join("")}</dl></div></div>`;
}

/* Aportar */
function vAportar(){
  if(C.mode!=="vivo")return `<div class="head"><div><h2>Aportar información</h2><p>Esta es la copia publicada del portal, de solo lectura.</p></div></div><div class="note">Los reportes se registran en el portal de trabajo de la Alcaldía. Si usted es enlace de una dependencia, solicite el acceso a la Jefatura de Prensa y TIC.</div>`;
  const T=[["medicion","Medición de una meta","Valor acumulado al corte de un indicador del Plan"],["documento","Documento o soporte","Proponer un documento nuevo o una nueva versión"],["dato","Conjunto de datos","Base o tabla para publicar en datos abiertos"],["observacion","Observación o error","Una cifra o ficha que debe corregirse"]];
  const mine=S.aportes.filter(a=>a.autor&&a.autor===C.uid).concat(S.mediciones.filter(m=>m.autor&&m.autor===C.uid).map(m=>({tipo:"medicion",resumen:"Meta "+m.n+" · "+m.periodo+": "+fmt(m.valor),estado:m.estado,ts:m.ts}))).sort((a,b)=>String(b.ts).localeCompare(String(a.ts)));
  let form="";
  if(UI.aporteTipo==="medicion")form=medForm(null);
  else form=`<form class="grid panel" id="fAp"><h3 class="full">${UI.aporteTipo==="documento"?"Proponer documento":UI.aporteTipo==="dato"?"Proponer conjunto de datos":"Reportar observación"}</h3>
    <label class="f">Dependencia<select id="apDep">${Object.keys(DEPS).filter(k=>k!=="EXT").map(k=>`<option value="${k}">${h(DEPS[k])}</option>`).join("")}</select></label>
    ${UI.aporteTipo==="documento"?`<label class="f">Serie<select id="apSer">${Object.keys(SERIES).map(k=>`<option value="${k}">${k} · ${h(SERIES[k])}</option>`).join("")}</select></label>`:UI.aporteTipo==="dato"?`<label class="f">Periodicidad<select id="apSer">${opt(["Mensual","Trimestral","Semestral","Anual"],"Trimestral")}</select></label>`:`<label class="f">Referencia (meta, código o fuente)<input id="apSer" placeholder="Ej. meta 45, ER-SPL-MA-GIE-001"></label>`}
    <label class="f full">${UI.aporteTipo==="observacion"?"Qué está mal y cómo debería quedar":"Título"}<input id="apTit" required></label>
    <label class="f full">Enlace (Drive u otro)<input id="apEnl" type="url" placeholder="https://"></label>
    <label class="f full">Descripción<textarea id="apDes"></textarea></label>
    <div class="full"><button class="btn primary" id="apSave">Enviar a revisión</button></div></form>`;
  return `<div class="head"><div><div class="eyebrow">Para los enlaces de cada dependencia</div><h2>Aportar información</h2><p>Todo lo que se envía queda en revisión. La Secretaría de Planeación lo valida contra la fuente antes de publicarlo.</p></div></div>
  <div class="tipos">${T.map(([k,t,d])=>`<button class="tipo" data-t="${k}" aria-pressed="${UI.aporteTipo===k}"><b>${t}</b><span>${d}</span></button>`).join("")}</div>
  ${form}
  <div><h3 style="margin-bottom:10px">Mis envíos</h3>${mine.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Estado</th></tr></thead><tbody>${mine.map(a=>`<tr><td class="num">${h(String(a.ts).slice(0,10))}</td><td>${h(a.tipo)}</td><td>${h(a.resumen)}</td><td>${estadoPill(a.estado)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Sus reportes aparecerán aquí con su estado de revisión.</div>'}</div>`;
}
vAportar.after=()=>{
  document.querySelectorAll(".tipo").forEach(b=>b.onclick=()=>{UI.aporteTipo=b.dataset.t;render()});
  bindMedForm(null);
  const f=$("#fAp");if(f)f.addEventListener("submit",async e=>{e.preventDefault();$("#apSave").disabled=true;
    const rec={tipo:UI.aporteTipo,dependencia:$("#apDep").value,detalle:$("#apSer").value,resumen:$("#apTit").value.trim(),enlace:$("#apEnl").value.trim(),descripcion:$("#apDes").value.trim(),autor:C.uid,estado:"Pendiente de revisión",ts:new Date().toISOString()};
    if(await write("aportes",null,rec)){toast("Enviado a revisión");render()}else $("#apSave").disabled=false});
};

/* Revisión (administradores) */
function vRevision(){
  if(!ED())return '<div class="empty">Esta sección es para la Secretaría de Planeación y la Jefatura de Prensa y TIC.</div>';
  const meds=S.mediciones.filter(m=>m.estado==="En revisión"),aps=S.aportes.filter(a=>a.estado==="Pendiente de revisión");
  const ind=n=>S.indicadores.find(i=>i.n==n)||{};
  return `<div class="head"><div><div class="eyebrow">Validación · procedimiento ER-SPL-PR-GIE-001</div><h2>Revisión</h2><p>Mediciones y propuestas enviadas por los enlaces. Al aprobar, la cifra o el cambio se publica en el portal.</p></div>
  <button class="btn" id="exp" ${C.dl?"":"disabled data-tip=\"La descarga no está disponible en esta vista\""}>Exportar datos para el subdominio</button></div>
  <div><h3 style="margin-bottom:10px">Mediciones por validar (${meds.length})</h3>
  ${meds.length?`<div class="tablewrap"><table><thead><tr><th>Meta</th><th>Corte</th><th>Valor</th><th>Fuente y evidencia</th><th>Reporta</th><th></th></tr></thead><tbody>${meds.map(m=>{const i=ind(m.n);return `<tr><td>${m.n} · ${h(String(i.indicador||"").slice(0,70))}<span class="sub">Meta 2028: ${fmt(i.meta)} ${h(i.unidad)}</span></td><td class="num">${h(m.periodo)}</td><td class="num">${fmt(m.valor)}</td><td>${h(m.fuente)}${m.enlace?` · <a href="${h(m.enlace)}" target="_blank" rel="noopener">evidencia</a>`:""}<span class="sub">${h(m.obs)}</span></td><td>${h(nameOf(m.autor))}</td><td style="white-space:nowrap"><button class="btn sm primary" data-okm="${h(m._id)}">Publicar</button> <button class="btn sm" data-nom="${h(m._id)}">Devolver</button></td></tr>`}).join("")}</tbody></table></div>`:'<div class="empty">No hay mediciones pendientes.</div>'}</div>
  <div><h3 style="margin-bottom:10px">Encuestas de usuarios</h3>${encResumen()}</div>
  <div><h3 style="margin-bottom:10px">Propuestas (${aps.length})</h3>
  ${aps.length?`<div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Tipo</th><th>Detalle</th><th>Reporta</th><th></th></tr></thead><tbody>${aps.map(a=>`<tr><td class="num">${h(String(a.ts).slice(0,10))}</td><td>${h(a.tipo)}</td><td>${h(a.resumen)}<span class="sub">${h(a.descripcion||(a.cambios?Object.entries(a.cambios).map(([k,v])=>k+": "+v).join(" · "):""))}</span>${a.enlace?`<a href="${h(a.enlace)}" target="_blank" rel="noopener">enlace</a>`:""}</td><td>${h(nameOf(a.autor))}</td><td style="white-space:nowrap"><button class="btn sm primary" data-oka="${h(a._id)}">Aprobar</button> <button class="btn sm" data-noa="${h(a._id)}">Rechazar</button></td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">No hay propuestas pendientes.</div>'}</div>
  <p class="note info">Para publicar el portal en un subdominio: exporte los datos, reemplace el archivo <span class="mono">datos.json</span> junto a <span class="mono">index.html</span> en el servidor y la copia pública mostrará el nuevo corte.</p>`;
}
vRevision.after=()=>{
  document.querySelectorAll("[data-okm]").forEach(b=>b.onclick=async()=>{b.disabled=true;if(await write("mediciones",b.dataset.okm,{estado:"Publicado",validadoPor:C.uid,validadoEn:today()},true))toast("Medición publicada")});
  document.querySelectorAll("[data-nom]").forEach(b=>b.onclick=async()=>{b.disabled=true;if(await write("mediciones",b.dataset.nom,{estado:"Devuelta",validadoPor:C.uid,validadoEn:today()},true))toast("Medición devuelta al responsable")});
  document.querySelectorAll("[data-noa]").forEach(b=>b.onclick=async()=>{b.disabled=true;if(await write("aportes",b.dataset.noa,{estado:"Rechazado",validadoEn:today()},true))toast("Propuesta rechazada")});
  document.querySelectorAll("[data-oka]").forEach(b=>b.onclick=async()=>{b.disabled=true;const a=S.aportes.find(x=>x._id===b.dataset.oka);if(!a)return;
    if(a.tipo==="fuente"&&a.ref&&a.cambios){if(!await write("fuentes",a.ref,a.cambios,true))return}
    if(await write("aportes",a._id,{estado:"Aprobado",validadoEn:today()},true))toast(a.tipo==="fuente"?"Fuente actualizada":"Propuesta aprobada. Registre el documento o dato en su sección.")});
  const e=$("#exp");if(e)e.onclick=async()=>{
    const strip=a=>a.map(x=>{const y=Object.assign({},x);delete y._id;delete y.autor;delete y.validadoPor;return y});
    const out={generado:new Date().toISOString(),config:Object.assign({},S.config,{actualizado:today()}),documentos:strip(S.documentos.filter(d=>d.acceso==="Pública")),fuentes:strip(S.fuentes),acciones:strip(S.acciones),pol17:strip(S.pol17),catalogo:{indicadores:{fuente:S.catFuente,items:S.indicadores}},mediciones:strip(S.mediciones.filter(m=>m.estado==="Publicado")),actas:strip(S.actas),aportes:[],hallazgos:strip(S.hallazgos.filter(x=>!x.reservado)),instancias:strip(S.instancias),directorio:S.directorio.map(x=>{const y=Object.assign({},x);delete y._id;delete y.autor;delete y.nombre;delete y.telefono;return y})};
    try{await C.dl.save({filename:"datos.json",data:JSON.stringify(out)});toast("Archivo datos.json listo")}catch(err){toast(err&&err.code==="declined"?"Descarga cancelada":"No se pudo descargar el archivo")}};
};

/* Tooltips */
(function(){const tip=$("#tip");let cur=null;
  function show(el,x,y){const t=el.getAttribute("data-tip");if(!t)return;cur=el;tip.textContent=t;tip.classList.add("on");place(el,x,y)}
  function place(el,x,y){const r=el.getBoundingClientRect();const tw=tip.offsetWidth,th=tip.offsetHeight;let px=x!=null?x+12:r.left+r.width/2-tw/2,py=y!=null?y-th-12:r.top-th-8;if(py<8)py=(y!=null?y+16:r.bottom+8);px=Math.max(8,Math.min(px,innerWidth-tw-8));tip.style.left=px+"px";tip.style.top=py+"px"}
  function hide(){cur=null;tip.classList.remove("on")}
  document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el&&el!==cur)show(el,e.clientX,e.clientY);else if(!el&&cur)hide()});
  document.addEventListener("mousemove",e=>{if(cur)place(cur,e.clientX,e.clientY)});
  document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)show(el);else hide()});
  document.addEventListener("focusout",hide);document.addEventListener("scroll",hide,true);
})();
go(location.hash.slice(1)||"inicio");
boot();
</script>
